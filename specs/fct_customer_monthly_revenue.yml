model: fct_customer_monthly_revenue
layer: marts
status: enforced
owner: data-team
description: >
  Revenue per customer per calendar month. Only months in which the customer
  placed at least one non-returned order are included.

grain: [customer_id, order_month]

depends_on: [stg_orders, stg_payments]

columns:
  - name: customer_id
    type: integer
    description: Customer who placed the orders.
    references: stg_customers.customer_id

  - name: order_month
    type: date
    description: First day of the calendar month of the order date.

  - name: order_count
    type: integer
    description: Number of non-returned orders in the month.
    checks: ["order_count >= 1"]

  - name: revenue
    type: decimal(18,2)
    description: Sum of payments on non-returned orders, in dollars.
    checks: ["revenue >= 0"]

rules:
  - Orders with status 'returned' or 'return_pending' do not count as revenue.
  - Revenue is the sum of all payments on an order, regardless of payment method.

# Each example verifies one rule: these input rows in, exactly these rows out.
examples:
  - name: returned orders do not count
    rule: 1
    given:
      stg_orders:
        - {order_id: 1, customer_id: 1, order_date: 2018-01-05, status: completed}
        - {order_id: 2, customer_id: 1, order_date: 2018-01-20, status: returned}
        - {order_id: 3, customer_id: 1, order_date: 2018-01-25, status: return_pending}
      stg_payments:
        - {payment_id: 1, order_id: 1, payment_method: credit_card, amount: 10}
        - {payment_id: 2, order_id: 2, payment_method: credit_card, amount: 99}
        - {payment_id: 3, order_id: 3, payment_method: credit_card, amount: 50}
    expect:
      - {customer_id: 1, order_month: 2018-01-01, order_count: 1, revenue: 10}

  - name: every payment method counts
    rule: 2
    given:
      stg_orders:
        - {order_id: 1, customer_id: 2, order_date: 2018-02-03, status: completed}
        - {order_id: 2, customer_id: 2, order_date: 2018-02-17, status: shipped}
      stg_payments:
        - {payment_id: 1, order_id: 1, payment_method: credit_card, amount: 10}
        - {payment_id: 2, order_id: 1, payment_method: gift_card, amount: 5}
        - {payment_id: 3, order_id: 2, payment_method: coupon, amount: 7}
    expect:
      - {customer_id: 2, order_month: 2018-02-01, order_count: 2, revenue: 22}
