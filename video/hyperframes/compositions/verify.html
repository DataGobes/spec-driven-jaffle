  <script>
    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#vf-term", { opacity: 0, y: 40, filter: "blur(8px)" },

    tl.fromTo("#vf-cmd", { clipPath: "inset(0 100% 0 0)" },
      { clipPath: "inset(0 0% 0 0)", duration: 0.7, ease: "none" }, 0.35);
    tl.fromTo("#vf-table", { opacity: 0, y: 40, filter: "blur(8px)" },
      { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.6, ease: "expo.out" }, 2.4);
    // 20 tests tick green, counter follows
    const segs = gsap.utils.toArray("#vf-prog .vf-seg");
    const t0 = 1.25, step = 0.33;
    segs.forEach((s, i) => {
      tl.fromTo(s, { backgroundColor: "#2c3138" }, { backgroundColor: "#3fb46a", duration: 0.12 }, t0 + i * step);
    });
    const ctr = { n: 0 };
    const ctrEl = document.querySelector("#vf-ctr");
    tl.fromTo(ctr, { n: 0 }, {
      n: 20, duration: step * 19 + 0.12, ease: "none",
      onUpdate: () => { ctrEl.textContent = "PASS " + String(Math.round(ctr.n)).padStart(2, " ") + "/20"; }
    }, t0);
    // categories light on their words
    [["#vf-r1", 3.55], ["#vf-r2", 4.27], ["#vf-r3", 5.2], ["#vf-r4", 6.16], ["#vf-r5", 7.25]].forEach(([s, t]) => {
      tl.fromTo(s + " .vf-band", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power2.out" }, t);
    });
    // payoff on "All green"
    tl.fromTo("#vf-table", { opacity: 1 }, { opacity: 0.35, duration: 0.3, ease: "power2.inOut", immediateRender: false }, 8.2);
    tl.fromTo("#vf-stamp", { opacity: 0, scale: 1.3, rotation: -4 },
      { opacity: 1, scale: 1, rotation: -4, duration: 0.35, ease: "back.out(1.6)" }, 8.45);
    tl.fromTo("#vf-term, #vf-stamp", { opacity: 1, filter: "blur(0px)" },
      { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power3.in", immediateRender: false }, 10.0);
    tl.fromTo("#vf-table", { opacity: 0.35 },
      { opacity: 0, duration: 0.2, ease: "power3.in", immediateRender: false }, 10.0);
